<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弯曲主路 · 地图拼接预览</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #111215; color: #eee9e3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button, input[type="text"] { color: inherit; border: 1px solid #454145; border-radius: 6px; background: #252428; }
    button { cursor: pointer; padding: 8px 13px; }
    button:hover { background: #343036; border-color: #82706b; }
    button:focus-visible, input:focus-visible { outline: 2px solid #e4a283; outline-offset: 3px; }
    button[aria-pressed="true"] { background: #51382f; border-color: #d39576; }
    header, main { max-width: 1800px; margin: auto; padding: 22px 28px; }
    header { padding-bottom: 0; }
    h1 { font-size: 24px; margin: 0 0 8px; font-weight: 650; }
    p { margin: 0; }
    .muted { color: #aaa4a4; font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
    form, .zoom-controls { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    label, .zoom-controls { font-size: 14px; }
    #sequence { width: 220px; padding: 8px 10px; letter-spacing: 2px; font-family: ui-monospace, monospace; }
    #sequence[aria-invalid="true"] { border-color: #ff998f; }
    input[type="range"] { width: 140px; accent-color: #d39576; }
    input[type="checkbox"] { accent-color: #d39576; }
    #zoom-value { min-width: 43px; font-variant-numeric: tabular-nums; }
    .error { min-height: 20px; margin-top: 7px; color: #ffaaa0; font-size: 13px; }
    .presets { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 0 16px; }
    .presets button { font-family: ui-monospace, monospace; padding: 6px 11px; font-size: 13px; }
    .map-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 10px; font-size: 13px; color: #bbb1ad; }
    #map-info { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .viewport { overflow: auto; background: #090a0c; border: 1px solid #3c3739; border-radius: 7px; min-height: 146px; max-height: 78vh; scrollbar-color: #696060 #171619; }
    .map { position: relative; display: flex; align-items: flex-start; width: max-content; line-height: 0; }
    .map img { display: block; flex: 0 0 auto; margin: 0; padding: 0; border: 0; max-width: none; user-select: none; }
    .seam { display: none; position: absolute; top: 0; bottom: 0; width: 1px; background: #83ffcf; box-shadow: 0 0 0 1px #12171466; pointer-events: none; }
    .map.show-seams .seam { display: block; }
    .seam { z-index: 4; }
    .level-marker { display: none; position: absolute; z-index: 3; width: 54px; height: 54px; padding: 0; border: 3px solid #b29259; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #754737, #3b2525 70%); color: #fff0cd; box-shadow: 0 3px 9px #000b, inset 0 0 0 3px #261c1dbb; font: 700 21px Georgia, serif; line-height: 1; transform-origin: center; }
    .map.show-levels .level-marker { display: grid; place-items: center; }
    .level-marker:hover, .level-marker[aria-pressed="true"] { border-color: #f7d293; background: radial-gradient(circle at 35% 28%, #a75a3d, #662e2c 70%); color: #fff6dd; box-shadow: 0 3px 12px #000b, 0 0 15px #ba673755, inset 0 0 0 3px #33201bcc; }
    #level-status { margin-top: 4px; min-height: 18px; }
    #asset-status { margin-top: 8px; min-height: 18px; }
    #asset-status[data-error="true"] { color: #ffaaa0; }
    .examples-heading { margin: 25px 0 12px; font-size: 16px; font-weight: 600; }
    .examples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .example { padding: 0; overflow: hidden; text-align: left; background: #19181c; }
    .example-info { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; gap: 10px; }
    .example-info strong { font: 600 15px ui-monospace, monospace; letter-spacing: 1px; }
    .thumb { display: flex; align-items: flex-start; width: 100%; line-height: 0; background: #090a0c; }
    .thumb img { display: block; flex: 0 0 auto; margin: 0; border: 0; height: auto; }
    footer { margin-top: 16px; font-size: 12px; color: #817c7c; }
    @media (max-width: 900px) { .examples { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { header, main { padding: 18px 14px; } header { padding-bottom: 0; } .examples { grid-template-columns: 1fr; } #sequence { width: 168px; } }
  </style>
</head>
<body>
  <header>
    <h1>弯曲主路 · 地图拼接预览</h1>
    <p class="muted">1 为起点，4 为终点；中间可任意排列、重复 2 和 3。沿弯路布置关卡，按钮可随时隐藏。</p>
  </header>
  <main>
    <div class="controls">
      <form id="sequence-form" novalidate>
        <label for="sequence">拼接序列</label>
        <input id="sequence" type="text" value="1234" pattern="1[23]*4" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="sequence-error" aria-invalid="false">
        <button type="submit">查看</button>
      </form>
      <div class="zoom-controls">
        <label for="zoom">缩放</label>
        <input id="zoom" type="range" min="1" max="150" step="1" value="60">
        <output id="zoom-value" for="zoom">60%</output>
        <button id="native-size" type="button">100%</button>
        <button id="fit-width" type="button">适合宽度</button>
      </div>
      <label><input id="seam-toggle" type="checkbox"> 显示接缝标线</label>
      <label><input id="level-toggle" type="checkbox" checked> 显示关卡按钮</label>
    </div>
    <p id="sequence-error" class="error" role="alert"></p>
    <nav id="presets" class="presets" aria-label="预设序列"></nav>
    <div class="map-meta">
      <p id="map-info" aria-live="polite"></p>
      <p>每块 543 × 724 px · 横向滚动可查看完整地图</p>
    </div>
    <div id="viewport" class="viewport" tabindex="0" aria-label="拼接地图，可横向滚动">
      <div id="map" class="map show-levels" role="group" aria-label=""></div>
    </div>
    <p id="asset-status" class="muted" role="status"></p>
    <p id="level-status" class="muted" role="status"></p>
    <h2 class="examples-heading">六种组合预览</h2>
    <div id="examples" class="examples"></div>
    <footer>关卡按钮是独立预览图层，PNG 素材不包含按钮。原图按相同比例显示，块间距为 0；接缝标线仅用于检查。</footer>
  </main>
  <script src="points.js"></script>
  <script>
    'use strict';

    const TILE_WIDTH = 543;
    const TILE_HEIGHT = 724;
    const ASSET_ROOT = '../../assets/resources/images/level-select/maps/continuous/modular-curved/';
    const PRESETS = ['14', '1234', '124', '134', '1224', '13234', '1334', '1324', '122334'];
    const VALID_SEQUENCE = /^1[23]*4$/;
    const sequenceInput = document.getElementById('sequence');
    const sequenceError = document.getElementById('sequence-error');
    const map = document.getElementById('map');
    const viewport = document.getElementById('viewport');
    const zoomInput = document.getElementById('zoom');
    const zoomValue = document.getElementById('zoom-value');
    const assetStatus = document.getElementById('asset-status');
    const seamToggle = document.getElementById('seam-toggle');
    const levelToggle = document.getElementById('level-toggle');
    const levelStatus = document.getElementById('level-status');
    let activeSequence = '1234';
    let zoomPercent = 60;
    let renderVersion = 0;

    function assetPath(tile) {
      return ASSET_ROOT + 'map_0' + tile + '.png';
    }

    function setZoom(percent) {
      zoomPercent = Math.max(1, Math.min(150, Number(percent)));
      zoomInput.value = String(zoomPercent);
      zoomValue.value = zoomPercent + '%';
      const scale = zoomPercent / 100;
      const width = TILE_WIDTH * scale;
      const height = TILE_HEIGHT * scale;
      map.style.width = (activeSequence.length * width) + 'px';
      map.style.height = height + 'px';
      map.querySelectorAll('img').forEach(img => {
        img.style.width = width + 'px';
        img.style.height = height + 'px';
      });
      map.querySelectorAll('.seam').forEach((seam, index) => {
        seam.style.left = ((index + 1) * width) + 'px';
      });
      map.querySelectorAll('.level-marker').forEach(marker => {
        marker.style.left = (Number(marker.dataset.x) * scale) + 'px';
        marker.style.top = (Number(marker.dataset.y) * scale) + 'px';
        marker.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      });
    }

    function addLevelMarkers(sequence) {
      const allPoints = window.MAP_LEVEL_POINTS || {};
      let number = 0;
      Array.from(sequence).forEach((tile, tileIndex) => {
        const points = Array.isArray(allPoints[tile]) ? allPoints[tile] : [];
        points.forEach(point => {
          if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y) ||
              point.x < 32 || point.x > TILE_WIDTH - 32 || point.y < 27 || point.y > TILE_HEIGHT - 27) return;
          const level = ++number;
          const marker = document.createElement('button');
          marker.type = 'button';
          marker.className = 'level-marker';
          marker.textContent = String(level);
          marker.dataset.x = String(tileIndex * TILE_WIDTH + point.x);
          marker.dataset.y = String(point.y);
          marker.setAttribute('aria-label', '关卡 ' + level + '，第 ' + (tileIndex + 1) + ' 块地图');
          marker.setAttribute('aria-pressed', 'false');
          marker.title = '关卡 ' + level;
          marker.addEventListener('click', () => {
            map.querySelectorAll('.level-marker').forEach(other => other.setAttribute('aria-pressed', String(other === marker)));
            levelStatus.textContent = '关卡 ' + level + ' · 第 ' + (tileIndex + 1) + ' 块（' + tile + ' 号素材）· 块内坐标 (' + point.x + ', ' + point.y + ')';
          });
          map.append(marker);
        });
      });
      levelStatus.textContent = number ? '沿路布置 ' + number + ' 个关卡按钮 · 点击按钮可查看块内坐标' : '关卡点位尚未配置；补充 points.js 后刷新即可显示。';
    }

    function showSequence(sequence) {
      if (!VALID_SEQUENCE.test(sequence)) {
        sequenceInput.setAttribute('aria-invalid', 'true');
        sequenceError.textContent = '请输入以 1 开头、4 结尾的序列，中间只能放 2 或 3，例如 14、1224、13234。';
        return false;
      }

      sequenceError.textContent = '';
      sequenceInput.setAttribute('aria-invalid', 'false');
      activeSequence = sequence;
      sequenceInput.value = sequence;
      const version = ++renderVersion;
      let loaded = 0;
      const missing = new Set();
      assetStatus.dataset.error = 'false';
      assetStatus.textContent = '正在加载地图…';
      document.getElementById('map-info').textContent = '序列 ' + sequence + ' · ' + sequence.length + ' 块 · 实际总尺寸 ' + (sequence.length * TILE_WIDTH) + ' × ' + TILE_HEIGHT + ' px';
      map.setAttribute('aria-label', '地图序列 ' + sequence + '，从左向右排列');
      map.replaceChildren();

      function updateStatus() {
        if (version !== renderVersion) return;
        assetStatus.dataset.error = String(missing.size > 0);
        if (missing.size > 0) {
          assetStatus.textContent = '未能加载 ' + Array.from(missing).join('、') + '。请确认地图文件位于 continuous/modular-curved 目录。';
        } else if (loaded === sequence.length) {
          assetStatus.textContent = '地图已加载。可切换序列检查重复与跳块接缝。';
        }
      }

      for (const tile of sequence) {
        const img = document.createElement('img');
        img.width = TILE_WIDTH;
        img.height = TILE_HEIGHT;
        img.alt = '';
        img.draggable = false;
        img.addEventListener('load', () => { loaded++; updateStatus(); });
        img.addEventListener('error', () => { missing.add('map_0' + tile + '.png'); updateStatus(); });
        img.src = assetPath(tile);
        map.append(img);
      }
      for (let index = 1; index < sequence.length; index++) {
        const seam = document.createElement('span');
        seam.className = 'seam';
        seam.setAttribute('aria-hidden', 'true');
        map.append(seam);
      }
      addLevelMarkers(sequence);
      setZoom(zoomPercent);
      viewport.scrollLeft = 0;
      document.querySelectorAll('[data-sequence]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.sequence === sequence));
      });
      return true;
    }

    function sequenceButton(sequence, className) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = className;
      button.dataset.sequence = sequence;
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => showSequence(sequence));
      return button;
    }

    for (const sequence of PRESETS) {
      const button = sequenceButton(sequence, '');
      button.textContent = sequence;
      document.getElementById('presets').append(button);
    }

    for (const sequence of PRESETS.slice(0, 6)) {
      const card = sequenceButton(sequence, 'example');
      card.setAttribute('aria-label', '查看序列 ' + sequence);
      const info = document.createElement('div');
      info.className = 'example-info';
      const title = document.createElement('strong');
      title.textContent = sequence;
      const detail = document.createElement('span');
      detail.className = 'muted';
      detail.textContent = sequence.length + ' 块 · ' + (sequence.length * TILE_WIDTH) + ' × ' + TILE_HEIGHT;
      info.append(title, detail);
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.style.aspectRatio = (sequence.length * TILE_WIDTH) + ' / ' + TILE_HEIGHT;
      thumb.setAttribute('aria-hidden', 'true');
      for (const tile of sequence) {
        const img = document.createElement('img');
        img.src = assetPath(tile);
        img.alt = '';
        img.width = TILE_WIDTH;
        img.height = TILE_HEIGHT;
        img.style.width = (100 / sequence.length) + '%';
        img.draggable = false;
        thumb.append(img);
      }
      card.append(info, thumb);
      document.getElementById('examples').append(card);
    }

    document.getElementById('sequence-form').addEventListener('submit', event => {
      event.preventDefault();
      showSequence(sequenceInput.value);
    });
    zoomInput.addEventListener('input', () => setZoom(zoomInput.value));
    document.getElementById('native-size').addEventListener('click', () => setZoom(100));
    document.getElementById('fit-width').addEventListener('click', () => {
      setZoom(Math.floor(viewport.clientWidth / (activeSequence.length * TILE_WIDTH) * 100));
    });
    seamToggle.addEventListener('change', () => map.classList.toggle('show-seams', seamToggle.checked));
    levelToggle.addEventListener('change', () => map.classList.toggle('show-levels', levelToggle.checked));

    showSequence(activeSequence);
  </script>
</body>
</html>
